name: Software regression controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements/scheduling.txt
      - name: Deterministic configuration and release controls (no inference claim)
        run: python -m pytest -q tests/test_phase5_llmops.py -k 'configuration or schema_omits or gate_requires or injected_critical or authorization_and_quality'
      - name: Actual scheduling solver and hard constraints
        run: python -m pytest -q tests/test_phase6_scheduling.py -k 'actual_solver or hard_constraint or parts_delivery or combined_team or independent_validator'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
